volumes:
  pgdata:
  redisdata:

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: minif2p }
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d minif2p"]
      interval: 3s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    command: ["redis-server","--appendonly","yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
  walletsvc:
    build:
      context: .
      dockerfile: Dockerfile.walletsvc
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/minif2p?sslmode=disable
      WALLET_HTTP_ADDR: ":8090"
      WALLET_INTERNAL_SECRET: "abc123123"
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8090:8090"]
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/minif2p?sslmode=disable
      REDIS_ADDR: "redis:6379"
      WALLET_BASE_URL: "http://walletsvc"
      HTTP_ADDR: ":8080"
      WALLET_HTTP_ADDR: ":8090"
      WALLET_INTERNAL_SECRET: "abc123123"
      WALLET_GRPC_ADDR: "walletsvc:9090"
    deploy:
      replicas: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      walletsvc:
        condition: service_started
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["80:80"]
    depends_on: [server]

